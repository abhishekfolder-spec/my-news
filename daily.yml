name: Daily News Digest

on:
  schedule:
    # 01:30 UTC = 07:00 IST. Cron is always UTC. Adjust to taste.
    - cron: "30 1 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # allow the job to commit the generated HTML back

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest
        env:
          # Only used if settings.use_ai_summary is true in config.yaml.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python digest.py

      - name: Commit updated dashboard
        run: |
          git config user.name  "news-digest-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Digest: $(date -u +%Y-%m-%d)"
          git push
