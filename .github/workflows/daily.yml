name: Daily News Digest

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      backtest_days:
        description: "Portfolio backtest: look back N days (blank = normal run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python digest.py

      - name: Portfolio backtest (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backtest_days != '' }}
        run: python portfolio.py --days ${{ inputs.backtest_days }} --out docs/portfolio-backtest.html

      - name: Commit updated dashboard
        run: |
          git config user.name  "news-digest-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Digest: $(date -u +%Y-%m-%d)"
          git push

      - name: Email today's digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_email.py
