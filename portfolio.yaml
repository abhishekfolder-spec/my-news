# Portfolio news tracker — stocks to watch
# ---------------------------------------------------------------------------
# nse:   NSE symbol (SME symbols: add `sme: true`)
# name:  official name, used to match BSE filings
# news:  search phrase(s) for Google News — quoted exact phrases, keep specific
# bse:   BSE scrip code. Leave blank: the script looks it up and prints a
#        mapping table on its first run so you can check it.
# group: holding | watchlist
# title_must / title_exclude: optional regex to keep news on-target
#        (e.g. 'Bank of India' must not pick up State Bank / Reserve Bank).
# No quantities or values are stored here (this repo is public).

