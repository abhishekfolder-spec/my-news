# ============================================================================
#  DAILY NEWS DIGEST  —  configuration
#  Everything the tool reads lives here. Edit this file, commit, done.
#  Every source is just an RSS/Atom URL. Substacks, X Lists, ET, Moneycontrol
#  all funnel through the same pipeline.
# ============================================================================

settings:
  title: "The Abhishek Wire"
  subtitle: "Personal markets · macro · micro briefing"
  timezone: "Asia/Kolkata"        # times in the dashboard are shown in this zone
  lookback_hours: 72              # only items published in the last N hours
  max_items_per_feed: 40          # safety cap per feed
  enrich_full_text: true          # pull full article body for summary-only feeds
  enrich_limit_per_feed: 5        # cap enrichment (keeps the daily run fast)
  fetch_workers: 8                # parallel feed downloads
  brief_size: 5                   # headlines on the Overview brief
  brief_themes:                   # the Overview brief draws only from these themes
    - "Equities"
    - "Rates"
    - "Macro"
    - "Commodities"
  cluster_threshold: 0.35         # 0-1; higher = stricter "same story" matching
  theme_fallback: "Macro"         # theme for stories no keyword rule matches
  theme_order:
    - "Equities"
    - "Rates"
    - "Macro"
    - "Energy"
    - "Commodities"
    - "Geopolitics"
    - "AI & Tech"
    - "India"
  # Keyword rules: a story goes to the theme whose keywords it matches most.
  # Title matches count double. Keywords are regular-expression prefixes.
  theme_rules:
    - {theme: "Equities", keywords: "stock|share|sensex|nifty|s&p|nasdaq|dow jones|earnings|ipo|equit|index|rally|selloff|bond market|market"}
    - {theme: "Rates", keywords: "rate|rbi|fed|inflation|yield|treasur|interest|hike|cpi|repo|bond"}
    - {theme: "Macro", keywords: "gdp|trade|tariff|export|import|economy|economic|growth|deficit|recession|imf|world bank|wto|currency|rupee|dollar|yen|tax|budget"}
    - {theme: "Energy", keywords: "oil|crude|brent|opec|lng|natural gas|solar|wind power|renewable|electricity|power grid|coal|nuclear|battery|energy|refin|diesel|petrol"}
    - {theme: "Commodities", keywords: "gold|silver|copper|platinum|metal|wheat|sugar|soybean|commodit|aluminium|steel|cotton"}
    - {theme: "Geopolitics", keywords: "war|iran|israel|gaza|russia|ukraine|china|taiwan|sanction|military|attack|ceasefire|summit|nato|houthi|election|diplomat|minister"}
    - {theme: "AI & Tech", keywords: "\\bai\\b|artificial intelligence|openai|anthropic|chip|semiconductor|nvidia|software|tech|cloud|model|startup|data center|google|microsoft|apple|meta|amazon"}
    - {theme: "India", keywords: "india|indian|modi|gst|parliament|cabinet|rupee|nse|bse|sebi|delhi|mumbai"}

  # AI summary is OFF by default (it needs a paid Anthropic API key).
  # The free heuristic brief runs otherwise. To enable: set this to true AND
  # add ANTHROPIC_API_KEY as a GitHub Actions secret.
  use_ai_summary: false
  ai_model: "claude-sonnet-5"     # change to any model your key can access

  # Market strip on the Overview. Symbols are Yahoo Finance tickers.
  markets:
    - {name: "Gold",             symbol: "GC=F"}
    - {name: "Silver",           symbol: "SI=F"}
    - {name: "S&P 500",          symbol: "^GSPC"}
    - {name: "Nifty 50",         symbol: "^NSEI"}
    - {name: "USD / INR",        symbol: "INR=X"}
    - {name: "USD / JPY",        symbol: "JPY=X"}
    - {name: "US 10Y yield",     symbol: "^TNX",     unit: "%"}
    - {name: "Brent crude",      symbol: "BZ=F"}

  # Order the dashboard sections appear in. Any category not listed is appended.
  category_order:
    - "Global Macro & Markets"
    - "Geopolitics"
    - "Indian Capital Markets"
    - "Energy"
    - "Asia & China"
    - "Europe"
    - "Technology"
    - "United States"
    - "Substacks"

# ============================================================================
#  SOURCES
#  name     : label shown on the dashboard
#  url      : RSS/Atom feed URL
#  category : which section it groups under (see category_order above)
#  enrich   : (optional) true = follow the link and pull full article text
#             Use for feeds that only give a headline + blurb (ET, Moneycontrol).
#             Leave off for Substacks / X (they already carry full text).
# ============================================================================
sources:

  # ---- Economic Times (native section feeds, headline+blurb -> enriched) ----
  - name: "ET · Top Stories"
    url: "https://economictimes.indiatimes.com/rssfeedstopstories.cms"
    category: "Indian Capital Markets"
    enrich: true
  - name: "ET · Markets"
    url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    category: "Indian Capital Markets"
    enrich: true
  - name: "ET · Economy"
    url: "https://economictimes.indiatimes.com/news/economy/rssfeeds/1373380680.cms"
    category: "Global Macro & Markets"
    enrich: true

  # ---- Moneycontrol (native section feeds -> enriched) ----
  - name: "Moneycontrol · Latest"
    url: "https://www.moneycontrol.com/rss/latestnews.xml"
    category: "Indian Capital Markets"
    enrich: true
  - name: "Moneycontrol · Business"
    url: "https://www.moneycontrol.com/rss/business.xml"
    category: "Indian Capital Markets"
    enrich: true
  - name: "Moneycontrol · Markets"
    url: "https://www.moneycontrol.com/rss/marketreports.xml"
    category: "Indian Capital Markets"
    enrich: true

  # ---- X / Twitter  (3 themed Lists -> 1 generated RSS feed each) -----------
  # HOW: create a List on X, add the handles (see README for my proposed split),
  #      open the List, paste its URL into rss.app / inoreader, copy the RSS URL,
  #      and drop it in below (replacing PASTE_...). Empty/PASTE_ urls are skipped.
  - name: "X · India Markets List"
    url: "PASTE_X_LIST_RSS_INDIA"
    category: "Indian Capital Markets"
  - name: "X · Global Macro List"
    url: "PASTE_X_LIST_RSS_MACRO"
    category: "Global Macro & Markets"
  - name: "X · Tech/Energy List"
    url: "PASTE_X_LIST_RSS_TECH"
    category: "Technology"


